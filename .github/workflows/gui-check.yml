name: GUI quick check

# Fast (a few minutes) feedback on window size, scrolling and start-up time. The full suite lives in build.yml.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Download Vazirmatn font
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets/fonts | Out-Null
          Invoke-WebRequest "https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip" -OutFile v.zip
          Expand-Archive v.zip -DestinationPath vz -Force
          Copy-Item (Get-ChildItem -Recurse vz -Filter "Vazirmatn-Regular.ttf" | Select-Object -First 1).FullName assets/fonts/
          Copy-Item (Get-ChildItem -Recurse vz -Filter "Vazirmatn-Bold.ttf" | Select-Object -First 1).FullName assets/fonts/
      - name: Layout and scrolling tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider tests/test_layout_fit.py --durations=10

      - name: Start-up profile
        continue-on-error: true
        timeout-minutes: 4
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/profile_window.py
