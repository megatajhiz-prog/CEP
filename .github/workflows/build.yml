name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy openpyxl pytest
      - name: Engine tests (GUI tests skip without PySide6)
        run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Download Vazirmatn font (optional, improves Persian rendering)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets/fonts | Out-Null
          Invoke-WebRequest "https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip" -OutFile v.zip
          Expand-Archive v.zip -DestinationPath vz -Force
          Copy-Item (Get-ChildItem -Recurse vz -Filter "Vazirmatn-Regular.ttf" | Select-Object -First 1).FullName assets/fonts/
          Copy-Item (Get-ChildItem -Recurse vz -Filter "Vazirmatn-Bold.ttf" | Select-Object -First 1).FullName assets/fonts/

      - name: Tests (engine + headless GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v --durations=30 --timeout=1800 -p no:cacheprovider

      - name: Build application
        run: pyinstaller build/Watra.spec --noconfirm --distpath dist --workpath build/work

      - name: Self-test the frozen executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Watra/Watra.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import waterprofiler;print(waterprofiler.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" build/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Silent install test
        shell: pwsh
        run: |
          $setup = Get-ChildItem Output/Watra-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "wp-install"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $t = Start-Process -FilePath (Join-Path $dir "Watra.exe") -ArgumentList "--selftest" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "installed app selftest exit code $($t.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: Watra-Setup
          path: Output/Watra-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/Watra-Setup-*.exe
